<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>No connection</title>
<style>
  html, body { margin: 0; height: 100%; background: #020b18; color: #c2e4fa;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 32px; box-sizing: border-box; }
  .fish { font-size: 56px; margin-bottom: 16px; }
  h1 { font-size: 22px; font-weight: 600; color: #fff; margin: 0 0 8px; }
  p { font-size: 15px; line-height: 1.5; color: #8fb8d6; margin: 0 0 28px; max-width: 300px; }
  button { background: #10b981; color: #020b18; border: 0; border-radius: 12px;
    padding: 14px 28px; font-size: 16px; font-weight: 600; }
  button:active { opacity: .8; }
</style>
</head>
<body>
<main>
  <div class="fish" aria-hidden="true">🐟</div>
  <h1>No connection</h1>
  <p>Underground Aquarium needs the internet. Check your Wi-Fi or signal, then try again.</p>
  <button type="button" onclick="location.href='https://www.undergroundaquarium.com'">Try again</button>
</main>
<script>
  // Come back on our own the moment the connection returns.
  window.addEventListener("online", function () { location.href = "https://www.undergroundaquarium.com"; });
</script>
</body>
</html>
